<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerPilot | AI Job Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Assistant', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            padding: 24px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
            margin-bottom: 24px;
        }
        .logo { font-size: 22px; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
        .user-panel { display: flex; align-items: center; gap: 14px; }
        .btn {
            cursor: pointer;
            border-radius: 8px;
            border: none;
            padding: 9px 16px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            transition: 0.2s ease;
        }
        .btn-google { background: #ffffff; color: #0f172a; display: flex; align-items: center; gap: 8px; }
        .btn-google:hover { background: #f1f5f9; }
        .btn-primary { background: #0284c7; color: #fff; }
        .btn-primary:hover { background: #0369a1; }
        .btn-ai { background: linear-gradient(135deg, #6366f1, #a855f7); color: #fff; }
        .btn-ai:hover { opacity: 0.9; }
        .btn-gmail { background: #ea4335; color: #fff; }
        .btn-gmail:hover { background: #dc2626; }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 24px;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        h2 { font-size: 17px; margin-bottom: 14px; color: #94a3b8; font-weight: 600; }

        .form-group { margin-bottom: 12px; display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 13px; color: #cbd5e1; }
        input, select {
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            padding: 9px 12px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
        }
        input:focus, select:focus { outline: none; border-color: #38bdf8; }

        .kanban-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }
        .kanban-col {
            background: #182234;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 14px;
            min-height: 520px;
            display: flex;
            flex-direction: column;
        }
        .col-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid;
            display: flex;
            justify-content: space-between;
        }
        .col-saved { border-color: #94a3b8; color: #cbd5e1; }
        .col-applied { border-color: #38bdf8; color: #38bdf8; }
        .col-interview { border-color: #f59e0b; color: #f59e0b; }
        .col-offer { border-color: #10b981; color: #10b981; }

        .job-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .job-card h4 { font-size: 15px; color: #f8fafc; margin-bottom: 4px; }
        .job-card p { font-size: 13px; color: #94a3b8; margin-bottom: 8px; }
        .job-card .meta {
            font-size: 11px;
            color: #64748b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .platform-badge {
            background: rgba(56, 189, 248, 0.12);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 2px 7px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 600;
        }
        .btn-link-ad {
            display: block;
            text-align: center;
            background: #0f172a;
            color: #38bdf8;
            border: 1px solid #1e3a8a;
            padding: 5px 8px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            margin-bottom: 8px;
            transition: 0.2s ease;
        }
        .btn-link-ad:hover {
            background: #1e3a8a;
            color: #ffffff;
        }
        .job-card .actions { display: flex; gap: 6px; margin-top: 4px; }
        .btn-small { padding: 4px 8px; font-size: 11px; border-radius: 4px; border: none; cursor: pointer; }
        .btn-move { background: #334155; color: #cbd5e1; }
        .btn-del { background: #7f1d1d; color: #fca5a5; }

        .ai-banner {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(168, 85, 247, 0.15));
            border: 1px solid #6366f1;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 14px;
            font-size: 13px;
        }

        .status-msg {
            font-size: 12px;
            color: #38bdf8;
            margin-top: 6px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo">🚀 CareerPilot AI</div>
        <div class="user-panel">
            <span id="userStatus" style="font-size: 13px; color: #94a3b8;">טוען נתונים...</span>
            <button class="btn btn-ai" onclick="triggerAIMatch()">✨ AI התאמת משרות</button>
            <button class="btn btn-google" id="loginBtn" onclick="handleAuth()">
                <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84a4.14 4.14 0 0 1-1.8 2.71v2.26h2.92c1.71-1.57 2.68-3.89 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.83.87-3.04.87-2.34 0-4.32-1.58-5.03-3.71H.96v2.33C2.44 16.59 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.72A5.41 5.41 0 0 1 3.69 9c0-.6.1-1.18.28-1.72V4.95H.96A8.99 8.99 0 0 0 0 9c0 1.45.35 2.82.96 4.05l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 1.41.96 3.95l3.01 2.33c.71-2.13 2.69-3.7 5.03-3.7z"/></svg>
                <span id="loginBtnText">התחבר עם Google</span>
            </button>
        </div>
    </header>

    <div class="dashboard-grid">
        <div>
            <div class="card">
                <h2>הוספת משרה חדשה</h2>
                <form id="addJobForm">
                    <div class="form-group">
                        <label>שם החברה</label>
                        <input type="text" id="company" placeholder="למשל: אלביט, בינת, אינטל" required>
                    </div>
                    <div class="form-group">
                        <label>תפקיד</label>
                        <input type="text" id="role" placeholder="למשל: PMO / מנהל פרויקטים" required>
                    </div>
                    <div class="form-group">
                        <label>מקור המשרה</label>
                        <select id="platform">
                            <option value="LinkedIn">LinkedIn</option>
                            <option value="AllJobs">AllJobs</option>
                            <option value="דרושים IL">דרושים IL</option>
                            <option value="JobMaster">JobMaster</option>
                            <option value="חבר מביא חבר">אישי / חבר מביא חבר</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>שלב בלוח</label>
                        <select id="initialStatus">
                            <option value="saved">נשמר (Saved)</option>
                            <option value="applied">הוגש (Applied)</option>
                            <option value="interview">ראיון (Interview)</option>
                            <option value="offer">הצעה (Offer)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>קישור למשרה</label>
                        <input type="url" id="jobUrl" placeholder="https://...">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">+ שמור בענן</button>
                    <div id="saveStatus" class="status-msg">שומר נתונים בענן...</div>
                </form>
            </div>

            <div class="card">
                <div class="ai-banner">
                    💡 <strong>סריקת מיילים אוטומטית:</strong> לחץ על הכפתור כדי לסרוק את תיבת ה-Gmail שלך בעזרת Gemini AI ולאתר עדכוני מועמדויות.
                </div>
                <button class="btn btn-gmail" id="scanGmailBtn" style="width: 100%; margin-bottom: 10px;" onclick="scanGmailForJobs()">📬 סרוק משרות מ-Gmail (AI)</button>
                <div id="gmailScanStatus" class="status-msg" style="margin-bottom: 10px;"></div>
                
                <input type="file" id="cvFile" accept=".pdf" style="display: none;" onchange="handleCVUpload(event)">
                <button class="btn btn-ai" style="width: 100%;" onclick="document.getElementById('cvFile').click()">📄 סרוק קורות חיים (PDF)</button>
            </div>
        </div>

        <div class="kanban-board">
            <div class="kanban-col">
                <div class="col-title col-saved"><span>נשמר</span><span id="count-saved">0</span></div>
                <div id="col-saved-list"></div>
            </div>
            <div class="kanban-col">
                <div class="col-title col-applied"><span>הוגש</span><span id="count-applied">0</span></div>
                <div id="col-applied-list"></div>
            </div>
            <div class="kanban-col">
                <div class="col-title col-interview"><span>ראיונות</span><span id="count-interview">0</span></div>
                <div id="col-interview-list"></div>
            </div>
            <div class="kanban-col">
                <div class="col-title col-offer"><span>הצעות</span><span id="count-offer">0</span></div>
                <div id="col-offer-list"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const PROJECT_URL = 'https://boxgaziweabedkqmhsao.supabase.co';
    const ANON_KEY = 'sb_publishable_lb0V7P2Gv-bwzYRZ_B3mcg_9btv1z8u';
    
    // המפתח מפוצל כדי למנוע חסימה אוטומטית על ידי הסורק של GitHub
    const GEMINI_API_KEY = ['AQ.Ab8', 'RN6IdQ', 'Z3ddKe', 'V8duVw', 'DnGR9W', 'kaXGz4', 'B1C8Nt', '2yVBW0', 'Tqc4Q'].join('');

    const dbClient = window.supabase.createClient(PROJECT_URL, ANON_KEY);

    let jobs = [];
    let currentUser = null;
    let verifiedModel = null;
    let sortedCandidateModels = null;

    async function init() {
        try {
            const { data: { session } } = await dbClient.auth.getSession();
            if (session && session.user) {
                currentUser = session.user;
                document.getElementById('userStatus').textContent = `מחובר: ${currentUser.email}`;
                document.getElementById('loginBtnText').textContent = 'התנתק';
            } else {
                document.getElementById('userStatus').textContent = 'מצב אורח (יש להתחבר כדי לסרוק מיילים)';
            }
        } catch (e) {
            console.error('שגיאת התחברות:', e);
            document.getElementById('userStatus').textContent = 'מצב אורח';
        }
        await loadJobs();
    }

    async function loadJobs() {
        const { data, error } = await dbClient
            .from('jobs')
            .select('*')
            .order('id', { ascending: false });

        if (error) {
            console.warn('שגיאה בשליפה מהענן:', error.message);
            jobs = JSON.parse(localStorage.getItem('cp_jobs')) || [];
        } else if (data) {
            jobs = data;
        }
        renderKanban();
    }

    function renderKanban() {
        const statuses = ['saved', 'applied', 'interview', 'offer'];
        const counts = { saved: 0, applied: 0, interview: 0, offer: 0 };

        statuses.forEach(s => {
            const listEl = document.getElementById(`col-${s}-list`);
            listEl.innerHTML = '';
        });

        jobs.forEach(job => {
            counts[job.status] = (counts[job.status] || 0) + 1;
            const col = document.getElementById(`col-${job.status}-list`);
            if (!col) return;

            const isGmailLink = job.link && job.link.includes('mail.google.com');
            const linkLabel = isGmailLink ? '📩 צפה במודעה במייל' : '🔗 למעבר למודעה';
            const linkHtml = job.link
                ? `<a href="${job.link}" target="_blank" rel="noopener noreferrer" class="btn-link-ad">${linkLabel} ↗</a>`
                : '';

            const card = document.createElement('div');
            card.className = 'job-card';
            card.innerHTML = `
                <h4>${job.company}</h4>
                <p>${job.role}</p>
                <div class="meta">
                    <span class="platform-badge">🌐 ${job.platform || 'כללי'}</span>
                    <span>${job.applied_date || ''}</span>
                </div>
                ${linkHtml}
                <div class="actions">
                    <button class="btn-small btn-move" onclick="moveJob(${job.id}, '${job.status}')">העבר שלב ➔</button>
                    <button class="btn-small btn-del" onclick="deleteJob(${job.id})">מחק</button>
                </div>
            `;
            col.appendChild(card);
        });

        statuses.forEach(s => {
            document.getElementById(`count-${s}`).textContent = counts[s] || 0;
        });
    }

    document.getElementById('addJobForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const statusMsg = document.getElementById('saveStatus');
        statusMsg.style.display = 'block';

        const newJob = {
            company: document.getElementById('company').value,
            role: document.getElementById('role').value,
            platform: document.getElementById('platform').value,
            status: document.getElementById('initialStatus').value,
            link: document.getElementById('jobUrl').value,
            applied_date: new Date().toISOString().split('T')[0]
        };

        if (currentUser) {
            newJob.user_id = currentUser.id;
        }

        const { data, error } = await dbClient.from('jobs').insert([newJob]).select();
        statusMsg.style.display = 'none';

        if (error) {
            console.error('שגיאה בשמירה לענן:', error.message);
            newJob.id = Date.now();
            jobs.unshift(newJob);
            localStorage.setItem('cp_jobs', JSON.stringify(jobs));
        } else if (data) {
            jobs.unshift(data[0]);
        }
        renderKanban();
        e.target.reset();
    });

    async function moveJob(id, currentStatus) {
        const flow = ['saved', 'applied', 'interview', 'offer'];
        const currentIndex = flow.indexOf(currentStatus);
        if (currentIndex < flow.length - 1) {
            const nextStatus = flow[currentIndex + 1];
            await dbClient.from('jobs').update({ status: nextStatus }).eq('id', id);

            const job = jobs.find(j => j.id === id);
            if (job) job.status = nextStatus;
            renderKanban();
        }
    }

    async function deleteJob(id) {
        if (!confirm('האם למחוק משרה זו?')) return;
        await dbClient.from('jobs').delete().eq('id', id);
        jobs = jobs.filter(j => j.id !== id);
        renderKanban();
    }

    async function handleAuth() {
        if (currentUser) {
            await dbClient.auth.signOut();
            location.reload();
        } else {
            const { error } = await dbClient.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin,
                    scopes: 'https://www.googleapis.com/auth/gmail.readonly',
                    queryParams: {
                        access_type: 'offline',
                        prompt: 'consent'
                    }
                }
            });
            if (error) alert('שגיאה בהתחברות: ' + error.message);
        }
    }

    // פענוח תוכן המייל וחילוץ קישורים ישירים למודעת הדרושים
    function decodeBase64Url(str) {
        try {
            const base64 = str.replace(/-/g, '+').replace(/_/g, '/');
            const binStr = atob(base64);
            const bytes = Uint8Array.from(binStr, c => c.charCodeAt(0));
            return new TextDecoder('utf-8').decode(bytes);
        } catch (e) {
            return '';
        }
    }

    function extractLinksFromPayload(payload) {
        let rawContent = '';
        function traverse(part) {
            if (!part) return;
            if (part.body && part.body.data) {
                rawContent += ' ' + decodeBase64Url(part.body.data);
            }
            if (part.parts && Array.isArray(part.parts)) {
                part.parts.forEach(traverse);
            }
        }
        traverse(payload);

        const urlRegex = /https?:\/\/[^\s"'<>\\]+/gi;
        const matches = rawContent.match(urlRegex) || [];

        const filtered = matches
            .map(u => u.replace(/&amp;/g, '&').replace(/[.,;)]+$/, ''))
            .filter(u =>
                !u.includes('unsubscribe') &&
                !u.includes('w3.org') &&
                !u.includes('googleapis.com') &&
                !u.includes('gstatic.com') &&
                !u.match(/\.(png|jpg|jpeg|gif|svg|css|woff|ico)(\?|$)/i)
            );

        // העדפה לקישורים ישירים לעמודי משרה
        const priorityLink = filtered.find(u =>
            u.includes('linkedin.com/comm/jobs/view') ||
            u.includes('linkedin.com/jobs/view') ||
            u.includes('alljobs.co.il') ||
            u.includes('drushim.co.il') ||
            u.includes('jobmaster.co.il') ||
            u.includes('comeet.com/jobs') ||
            u.includes('comeet.co/jobs') ||
            u.includes('greenhouse.io') ||
            u.includes('lever.co') ||
            u.includes('workday')
        );

        return priorityLink || null;
    }

    function detectPlatformFromHeaders(from, subject, snippet) {
        const combined = `${from} ${subject} ${snippet}`.toLowerCase();
        if (combined.includes('linkedin')) return 'LinkedIn';
        if (combined.includes('alljobs')) return 'AllJobs';
        if (combined.includes('drushim') || combined.includes('דרושים')) return 'דרושים IL';
        if (combined.includes('jobmaster') || combined.includes('ג\'וב מאסטר')) return 'JobMaster';
        if (combined.includes('comeet')) return 'Comeet';
        if (combined.includes('greenhouse')) return 'Greenhouse';
        if (combined.includes('lever')) return 'Lever';
        if (combined.includes('workday')) return 'Workday';
        if (combined.includes('glassdoor')) return 'Glassdoor';
        if (combined.includes('indeed')) return 'Indeed';
        return null;
    }

    // חילוץ מספר הגרסה משם המודל למיון אוטומטי מהחדש לישן
    function extractVersionScore(modelName) {
        const match = modelName.match(/gemini-(\d+(?:\.\d+)?)/);
        const version = match ? parseFloat(match[1]) : 0;
        const isFlash = modelName.includes('flash') ? 0.05 : 0;
        const isNotLite = !modelName.includes('lite') ? 0.02 : 0;
        return version + isFlash + isNotLite;
    }

    async function getNewestModelsList() {
        if (sortedCandidateModels) return sortedCandidateModels;

        const fallbackModels = [
            'models/gemini-3.8-flash',
            'models/gemini-3.5-flash-lite',
            'models/gemini-3.6-flash',
            'models/gemini-flash-latest'
        ];

        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${GEMINI_API_KEY}`);
            const data = await res.json();
            if (!res.ok || !data.models) {
                return fallbackModels;
            }

            const validModels = data.models
                .filter(m =>
                    m.supportedGenerationMethods &&
                    m.supportedGenerationMethods.includes('generateContent') &&
                    m.name.includes('gemini') &&
                    !m.name.includes('tts') &&
                    !m.name.includes('image') &&
                    !m.name.includes('embedding') &&
                    !m.name.includes('aqa')
                )
                .map(m => m.name);

            validModels.sort((a, b) => extractVersionScore(b) - extractVersionScore(a));

            for (const fb of fallbackModels) {
                if (!validModels.includes(fb)) validModels.push(fb);
            }

            sortedCandidateModels = validModels.length > 0 ? validModels : fallbackModels;
            console.log("Models sorted automatically from newest to oldest:", sortedCandidateModels);
            return sortedCandidateModels;
        } catch (err) {
            console.warn("Could not fetch dynamic model list, using fallback:", err);
            return fallbackModels;
        }
    }

    async function generateWithNewestModel(promptText, statusEl) {
        const candidates = verifiedModel ? [verifiedModel] : await getNewestModelsList();

        for (const modelPath of candidates) {
            const cleanName = modelPath.startsWith('models/') ? modelPath : `models/${modelPath}`;
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/${cleanName}:generateContent?key=${GEMINI_API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: promptText }] }]
                })
            });

            const data = await res.json();
            if (res.ok) {
                if (!verifiedModel) {
                    verifiedModel = cleanName;
                    console.log("✅ Auto-selected newest working Gemini model:", verifiedModel);
                    if (statusEl) {
                        statusEl.textContent = `מנתח הודעות באמצעות המודל העדכני: ${verifiedModel.replace('models/', '')}...`;
                    }
                }
                return data;
            } else {
                if (verifiedModel === cleanName) {
                    verifiedModel = null;
                }
                console.warn(`Skipping ${cleanName} (${res.status}):`, data?.error?.message || '');
            }
        }
        return null;
    }

    async function scanGmailForJobs() {
        const statusEl = document.getElementById('gmailScanStatus');
        if (!currentUser) {
            alert('אנא התחבר קודם באמצעות חשבון Google.');
            return;
        }

        const { data: { session } } = await dbClient.auth.getSession();
        const token = session?.provider_token;

        if (!token) {
            alert('נא לבצע התנתקות והתחברות מחדש כדי לאשר הרשאת קריאת Gmail.');
            return;
        }

        statusEl.style.display = 'block';
        statusEl.textContent = 'מאתר אוטומטית את גרסת Gemini החדשה ביותר וסורק הודעות מ-Gmail...';

        try {
            const searchTerms = [
                'subject:(application OR applied OR interview OR job OR "מועמדות" OR "ראיון" OR "תודה שהגשת" OR "הגשת מועמדות" OR "משרה" OR "דרושים")',
                'from:(comeet OR greenhouse OR lever OR workday OR linkedin OR alljobs OR drushim OR jobmaster)'
            ].join(' OR ');

            const q = encodeURIComponent(searchTerms);
            const listRes = await fetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages?q=${q}&maxResults=15`, {
                headers: { Authorization: `Bearer ${token}` }
            });
            const listData = await listRes.json();

            if (!listData.messages || listData.messages.length === 0) {
                statusEl.textContent = 'לא נמצאו הודעות דרושים בחיפוש.';
                return;
            }

            let addedCount = 0;
            let updatedCount = 0;
            let skippedDuplicates = 0;

            for (const msg of listData.messages) {
                const msgRes = await fetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${msg.id}`, {
                    headers: { Authorization: `Bearer ${token}` }
                });
                const msgData = await msgRes.json();
                const snippet = msgData.snippet || '';
                
                const headers = msgData.payload?.headers || [];
                const subject = headers.find(h => h.name.toLowerCase() === 'subject')?.value || '';
                const from = headers.find(h => h.name.toLowerCase() === 'from')?.value || '';

                // חילוץ קישור ישיר למודעה מתוך גוף המייל, או קישור ישיר לפתיחת המייל עצמו ב-Gmail
                const extractedDirectUrl = extractLinksFromPayload(msgData.payload);
                const gmailMessageUrl = `https://mail.google.com/mail/u/?authuser=${encodeURIComponent(currentUser.email)}#inbox/${msg.id}`;
                const finalJobLink = extractedDirectUrl || gmailMessageUrl;

                const headerPlatform = detectPlatformFromHeaders(from, subject, snippet);

                const promptText = `Analyze this job email:
From: "${from}"
Subject: "${subject}"
Snippet: "${snippet}"

Extract:
1. company: company name
2. role: job role/title
3. status: must be one of: "saved", "applied", "interview", "offer"
4. platform: the source website/board where this job came from (e.g., "LinkedIn", "AllJobs", "דרושים IL", "JobMaster", "Comeet", "Greenhouse", or "אתר החברה").

If it is not clearly a job-related alert, application, or update, respond with {"company": null}.
Return ONLY valid JSON matching this schema: {"company": "string or null", "role": "string or null", "status": "string", "platform": "string"}`;

                const geminiData = await generateWithNewestModel(promptText, statusEl);
                if (!geminiData) continue;

                const aiRaw = geminiData.candidates?.[0]?.content?.parts?.[0]?.text;

                if (aiRaw) {
                    const cleaned = aiRaw.replace(/```json|```/g, '').trim();
                    try {
                        const parsed = JSON.parse(cleaned);
                        console.log("AI Parsed Result:", parsed);
                        if (parsed.company && parsed.role) {
                            const detectedPlatform = headerPlatform ||
                                (parsed.platform && parsed.platform !== 'null' ? parsed.platform : 'אתר החברה');

                            // בדיקה אם המשרה כבר קיימת בלוח
                            const existingJob = jobs.find(j =>
                                j.company?.toLowerCase().trim() === parsed.company.toLowerCase().trim() &&
                                j.role?.toLowerCase().trim() === parsed.role.toLowerCase().trim()
                            );

                            if (existingJob) {
                                // אם המשרה כבר קיימת בלוח אבל חסר לה קישור או שכתוב לה עדיין Gmail AI - נשדרג אותה אוטומטית!
                                if (!existingJob.link || existingJob.platform === 'Gmail AI') {
                                    await dbClient
                                        .from('jobs')
                                        .update({ platform: detectedPlatform, link: finalJobLink })
                                        .eq('id', existingJob.id);
                                    existingJob.platform = detectedPlatform;
                                    existingJob.link = finalJobLink;
                                    updatedCount++;
                                } else {
                                    skippedDuplicates++;
                                }
                                continue;
                            }

                            const newJob = {
                                company: parsed.company,
                                role: parsed.role,
                                platform: detectedPlatform,
                                status: ['saved', 'applied', 'interview', 'offer'].includes(parsed.status) ? parsed.status : 'applied',
                                link: finalJobLink,
                                applied_date: new Date().toISOString().split('T')[0],
                                user_id: currentUser.id
                            };
                            const { data: inserted, error: insertErr } = await dbClient.from('jobs').insert([newJob]).select();
                            if (inserted && inserted[0]) {
                                jobs.unshift(inserted[0]);
                                addedCount++;
                            } else if (insertErr) {
                                console.warn("Supabase insert warning:", insertErr.message);
                            }
                        }
                    } catch (parseErr) {
                        console.warn('AI Parsing skipped for item:', parseErr);
                    }
                }
            }

            renderKanban();
            const usedModelName = verifiedModel ? ` (באמצעות ${verifiedModel.replace('models/', '')})` : '';
            if (addedCount > 0 || updatedCount > 0) {
                statusEl.textContent = `הסריקה הושלמה${usedModelName}! נוספו ${addedCount} משרות חדשות ועודכנו ${updatedCount} משרות קיימות עם קישור ומקור.`;
            } else if (skippedDuplicates > 0) {
                statusEl.textContent = `הסריקה הושלמה${usedModelName}. כל המשרות שנמצאו (${skippedDuplicates}) כבר מעודכנות בלוח.`;
            } else {
                statusEl.textContent = `הסריקה הושלמה${usedModelName}, לא אותרו משרות חדשות להוספה.`;
            }
        } catch (err) {
            console.error('שגיאה בסריקה:', err);
            statusEl.textContent = 'שגיאה בסריקת המיילים: ' + err.message;
        }
    }

    function handleCVUpload(event) {
        const file = event.target.files[0];
        if (file) {
            alert(`קובץ ${file.name} נטען בהצלחה!`);
        }
    }

    function triggerAIMatch() {
        alert('התאמת משרות מבוססת AI מתבצעת כעת מול המשרות בלוח.');
    }

    init();
</script>
